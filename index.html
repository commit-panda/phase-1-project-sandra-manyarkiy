<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Mate</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css" />

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>

    <!-- Weather Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css"/>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WeatherMate" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <div class="main">
      <div class="weather-panel">
        <h1>Weather Mate</h1>

        <!-- Search -->
        <div class="search">
          <form id="weather-form">
            <input type="text" id="city-input" placeholder="Enter city name" required />
            <button type="submit">Search</button>
          </form>
        </div>

        <!-- Current Weather -->
        <div class="row mb-4">
          <div class="col-6 text-start">
            <h2 id="city-name">
              <br />
              <small id="today-date"></small>
            </h2>
            <p class="h3" id="weather-condition">
              <!-- Weather icon and condition go here -->
            </p>
          </div>
          <div class="col-6 text-end">
            <div class="h1 temperature">
              <span id="current-temp"></span> <br />
              <small id="temp-range"></small>
            </div>
          </div>
        </div>

        <!-- Forecast -->
        <div class="forecast-wrapper">
          <ul class="forecast">
            <!-- forecast items will go here -->
          </ul>
        </div>
      </div>
    </div>

    <!-- Modal: Recommended Activity Popup -->
    <div class="modal fade" id="activityModal" tabindex="-1" aria-labelledby="activityModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
          <div class="modal-header">
            <h5 class="modal-title" id="activityModalLabel">Activities</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="activity-content">
            <p>Loading activities...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="spinner-container d-none">
      <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
